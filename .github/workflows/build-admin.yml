name: Build SAN STORE Admin APK

on:
  push:
    paths:
      - 'SAN-STORE-ADMIN-CORRIGIDO-FONTE-v1.2.0.zip'
      - '.github/workflows/build-admin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 17 SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Download Gradle 8.13
        run: |
          curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-8.13-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
      - name: Build debug APK
        run: |
          mkdir -p "$RUNNER_TEMP/admin-source"
          unzip -q 'SAN-STORE-ADMIN-CORRIGIDO-FONTE-v1.2.0.zip' -d "$RUNNER_TEMP/admin-source"
          cd "$RUNNER_TEMP/admin-source/SAN-STORE-ADMIN-CORRIGIDO-v1.2.0/FONTE/SAN_STORE_ADMIN_ANDROID"
          "$RUNNER_TEMP/gradle-8.13/bin/gradle" --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAN-STORE-ADMIN-APK-v1.2.0
          path: ${{ runner.temp }}/admin-source/SAN-STORE-ADMIN-CORRIGIDO-v1.2.0/FONTE/SAN_STORE_ADMIN_ANDROID/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
