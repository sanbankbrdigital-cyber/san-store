name: Build SAN STORE Admin APK

on:
  push:
    paths:
      - 'SAN-STORE-ADMIN-CORRIGIDO-FONTE-v1.0.1.zip'
      - '.github/workflows/build-admin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null

      - name: Install Android 17 SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'

      - name: Download Gradle 8.13
        run: |
          curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-8.13-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"

      - name: Build debug APK
        run: |
          mkdir -p "$RUNNER_TEMP/admin-source"
          unzip -q 'SAN-STORE-ADMIN-CORRIGIDO-FONTE-v1.0.1.zip' -d "$RUNNER_TEMP/admin-source"
          cd "$RUNNER_TEMP/admin-source/SAN-STORE-ADMIN-CORRIGIDO-v1.0.1/FONTE/SAN_STORE_ADMIN_ANDROID"
          "$RUNNER_TEMP/gradle-8.13/bin/gradle" --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAN-STORE-ADMIN-APK-v1.0.1
          path: ${{ runner.temp }}/admin-source/SAN-STORE-ADMIN-CORRIGIDO-v1.0.1/FONTE/SAN_STORE_ADMIN_ANDROID/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
